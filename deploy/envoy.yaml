# gRPC-Web <-> gRPC proxy for Flutter web (browsers cannot speak native gRPC).
# Dev only: allows localhost origins and reaches the gRPC server on the host
# (`make grpc`) through host.docker.internal. Production config lives in phase 38.
static_resources:
  listeners:
    - name: grpc_web
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: grpc_web
                route_config:
                  name: local
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - safe_regex: { regex: "https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?" }
                          allow_methods: "GET, POST, OPTIONS"
                          allow_headers: "content-type,x-grpc-web,x-user-agent,grpc-timeout,authorization,x-workspace,x-client-id"
                          expose_headers: "grpc-status,grpc-message,x-error-permission-bin,x-error-role-bin,x-error-hint-bin"
                          max_age: "1728000"
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: grpc_backend, timeout: 0s }
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: grpc_backend
      type: LOGICAL_DNS
      connect_timeout: 5s
      dns_lookup_family: V4_ONLY  # host.docker.internal also resolves to IPv6 on Docker Desktop
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: grpc_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 50051 }
