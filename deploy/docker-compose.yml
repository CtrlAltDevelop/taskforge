# Local dev services. The Django servers and Flutter run on the host for fast reload.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge-dev-only
    ports: ["127.0.0.1:5432:5432"]  # loopback only: dev password is in the repo
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]  # loopback only: no password
  envoy:
    image: envoyproxy/envoy:v1.32-latest
    command: ["-c", "/etc/envoy/envoy.yaml"]
    volumes: ["./envoy.yaml:/etc/envoy/envoy.yaml:ro"]
    ports: ["127.0.0.1:8081:8080"]  # host 8081: 8080 is commonly taken
    extra_hosts: ["host.docker.internal:host-gateway"]
  # Optional (`docker compose --profile sso up`): a dev identity provider for phase 37. Issuer
  # http://localhost:8082/realms/taskforge, client `taskforge` / secret `taskforge-dev-only`, user
  # dev@taskforge.test / dev-only-password. Plain http to localhost is accepted by the backend
  # only while DEBUG is on.
  keycloak:
    profiles: ["sso"]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev-only
    volumes: ["./keycloak/taskforge-realm.json:/opt/keycloak/data/import/taskforge-realm.json:ro"]
    ports: ["127.0.0.1:8082:8080"]  # loopback only: dev credentials are in the repo
  # Optional (`docker compose --profile workers up`): the same code as the API, in Celery roles.
  worker:
    profiles: ["workers"]
    image: python:3.12-slim
    working_dir: /app/src
    volumes: ["../backend:/app"]
    command: sh -c "pip install -q -e /app && celery -A config worker -l info"
    env_file: ../backend/.env
    environment: &celery_env
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_REDIS_URL: redis://redis:6379/0
      DJANGO_DB_HOST: postgres
    depends_on: [postgres, redis]
  beat:
    profiles: ["workers"]
    image: python:3.12-slim
    working_dir: /app/src
    volumes: ["../backend:/app"]
    command: sh -c "pip install -q -e /app && celery -A config beat -l info"
    env_file: ../backend/.env
    environment: *celery_env
    depends_on: [redis]
volumes:
  pgdata:
