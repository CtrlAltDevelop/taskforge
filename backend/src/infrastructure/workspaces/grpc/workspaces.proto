syntax = "proto3";

package config.workspaces;

import "google/protobuf/empty.proto";

service WorkspaceController {
    rpc Create(WorkspaceCreateRequest) returns (Workspace) {}
    rpc Delete(WorkspaceDeleteRequest) returns (Workspace) {}
    rpc List(google.protobuf.Empty) returns (WorkspaceList) {}
    rpc ListDeleted(google.protobuf.Empty) returns (WorkspaceList) {}
    rpc Restore(WorkspaceRestoreRequest) returns (Workspace) {}
    rpc Update(WorkspaceUpdateRequest) returns (Workspace) {}
}

message Workspace {
    string id = 1;
    string name = 2;
    string slug = 3;
    string logo = 4;
    string created_by = 5;
    string created_at = 6;
    string deleted_at = 7;
    int32 version = 8;
    bool is_owner = 9;
}

message WorkspaceCreateRequest {
    string name = 1;
    string slug = 2;
}

message WorkspaceDeleteRequest {
    string id = 1;
    string confirmation = 2;
}

message WorkspaceList {
    repeated Workspace workspaces = 1;
}

message WorkspaceRestoreRequest {
    string id = 1;
}

message WorkspaceUpdateRequest {
    string id = 1;
    int32 expected_version = 2;
    optional string name = 3;
    optional string slug = 4;
}

