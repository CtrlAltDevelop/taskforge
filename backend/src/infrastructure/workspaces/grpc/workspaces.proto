syntax = "proto3";

package config.workspaces;

import "google/protobuf/empty.proto";

service InvitationController {
    rpc Accept(InvitationAcceptRequest) returns (Workspace) {}
    rpc Create(InvitationCreateRequest) returns (InvitationCreateResponse) {}
    rpc CreateLink(InvitationCreateLinkRequest) returns (Invitation) {}
    rpc Decline(InvitationDeclineRequest) returns (InvitationEmpty) {}
    rpc List(InvitationListRequest) returns (InvitationList) {}
    rpc Resend(InvitationResendRequest) returns (Invitation) {}
    rpc Revoke(InvitationRevokeRequest) returns (Invitation) {}
}

service MemberController {
    rpc Leave(MemberLeaveRequest) returns (MemberEmpty) {}
    rpc List(MemberListRequest) returns (MemberList) {}
    rpc Remove(MemberRemoveRequest) returns (MemberEmpty) {}
    rpc SetRole(MemberSetRoleRequest) returns (Member) {}
}

service PermissionController {
    rpc Check(PermissionCheckRequest) returns (PermissionCheckResponse) {}
}

service RoleController {
    rpc Create(RoleCreateRequest) returns (Role) {}
    rpc Delete(RoleDeleteRequest) returns (RoleEmpty) {}
    rpc List(RoleListRequest) returns (RoleList) {}
    rpc Update(RoleUpdateRequest) returns (Role) {}
}

service WorkspaceController {
    rpc Create(WorkspaceCreateRequest) returns (Workspace) {}
    rpc Delete(WorkspaceDeleteRequest) returns (Workspace) {}
    rpc List(google.protobuf.Empty) returns (WorkspaceList) {}
    rpc ListDeleted(google.protobuf.Empty) returns (WorkspaceList) {}
    rpc Restore(WorkspaceRestoreRequest) returns (Workspace) {}
    rpc Update(WorkspaceUpdateRequest) returns (Workspace) {}
}

message Invitation {
    string id = 1;
    string workspace_id = 2;
    string email = 3;
    bool is_link = 4;
    string created_by = 5;
    string created_by_name = 6;
    string created_at = 7;
    string expires_at = 8;
    int32 max_uses = 9;
    int32 uses = 10;
    string state = 11;
    string token = 12;
    string role_id = 13;
    string role_name = 14;
}

message InvitationAcceptRequest {
    string token = 1;
}

message InvitationCreateLinkRequest {
    string workspace_id = 1;
    int32 expires_in = 2;
    int32 max_uses = 3;
    string role_id = 4;
}

message InvitationCreateRequest {
    string workspace_id = 1;
    repeated string emails = 2;
    string role_id = 3;
}

message InvitationCreateResponse {
    repeated Invitation invitations = 1;
    repeated string skipped_emails = 2;
    repeated string undelivered_emails = 3;
}

message InvitationDeclineRequest {
    string token = 1;
}

message InvitationEmpty {
}

message InvitationList {
    repeated Invitation invitations = 1;
}

message InvitationListRequest {
    string workspace_id = 1;
}

message InvitationResendRequest {
    string workspace_id = 1;
    string id = 2;
}

message InvitationRevokeRequest {
    string workspace_id = 1;
    string id = 2;
}

message Member {
    string user_id = 1;
    string display_name = 2;
    string email = 3;
    string joined_at = 4;
    bool is_owner = 5;
    string status = 6;
    string role_id = 7;
    string role_name = 8;
}

message MemberEmpty {
}

message MemberLeaveRequest {
    string workspace_id = 1;
}

message MemberList {
    repeated Member members = 1;
}

message MemberListRequest {
    string workspace_id = 1;
}

message MemberRemoveRequest {
    string workspace_id = 1;
    string user_id = 2;
}

message MemberSetRoleRequest {
    string workspace_id = 1;
    string user_id = 2;
    string role_id = 3;
}

message PermissionAnswer {
    string key = 1;
    bool allowed = 2;
}

message PermissionArea {
    string area = 1;
    repeated PermissionInfo permissions = 2;
}

message PermissionCheckRequest {
    string workspace_id = 1;
    repeated string keys = 2;
}

message PermissionCheckResponse {
    repeated PermissionAnswer answers = 1;
    string role_id = 2;
    string role_name = 3;
}

message PermissionInfo {
    string key = 1;
    string label = 2;
}

message Role {
    string id = 1;
    string name = 2;
    bool is_builtin = 3;
    repeated string permissions = 4;
    int32 member_count = 5;
    int32 version = 6;
}

message RoleCreateRequest {
    string workspace_id = 1;
    string name = 2;
    repeated string permissions = 3;
}

message RoleDeleteRequest {
    string workspace_id = 1;
    string id = 2;
    string reassign_to = 3;
}

message RoleEmpty {
}

message RoleList {
    repeated Role roles = 1;
    repeated PermissionArea registry = 2;
}

message RoleListRequest {
    string workspace_id = 1;
}

message RoleUpdateRequest {
    string workspace_id = 1;
    string id = 2;
    string name = 3;
    repeated string permissions = 4;
    int32 expected_version = 5;
}

message Workspace {
    string id = 1;
    string name = 2;
    string slug = 3;
    string logo = 4;
    string created_by = 5;
    string created_at = 6;
    string deleted_at = 7;
    int32 version = 8;
    bool is_owner = 9;
}

message WorkspaceCreateRequest {
    string name = 1;
    string slug = 2;
}

message WorkspaceDeleteRequest {
    string id = 1;
    string confirmation = 2;
}

message WorkspaceList {
    repeated Workspace workspaces = 1;
}

message WorkspaceRestoreRequest {
    string id = 1;
}

message WorkspaceUpdateRequest {
    string id = 1;
    int32 expected_version = 2;
    optional string name = 3;
    optional string slug = 4;
}

