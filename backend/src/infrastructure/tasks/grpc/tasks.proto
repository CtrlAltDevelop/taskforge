syntax = "proto3";

package config.tasks;

service LinkController {
    rpc Add(LinkAddRequest) returns (LinkList) {}
    rpc ListForTask(LinkListForTaskRequest) returns (LinkList) {}
    rpc Remove(LinkRemoveRequest) returns (LinkList) {}
    rpc SearchTasks(LinkSearchTasksRequest) returns (LinkCandidates) {}
}

service TaskController {
    rpc Create(TaskCreateRequest) returns (Task) {}
    rpc Delete(TaskDeleteRequest) returns (Task) {}
    rpc Get(TaskGetRequest) returns (Task) {}
    rpc List(TaskListRequest) returns (stream Task) {}
    rpc ListChildren(TaskListChildrenRequest) returns (TaskChildren) {}
    rpc ListTrash(TaskListTrashRequest) returns (TaskTrash) {}
    rpc Move(TaskMoveRequest) returns (Task) {}
    rpc Restore(TaskRestoreRequest) returns (Task) {}
    rpc SetParent(TaskSetParentRequest) returns (Task) {}
    rpc Update(TaskUpdateRequest) returns (Task) {}
}

message Link {
    string id = 1;
    string kind = 2;
    bool restricted = 3;
    string other_id = 4;
    string other_project_id = 5;
    string other_display_id = 6;
    string other_title = 7;
    string other_status_name = 8;
    string other_status_category = 9;
}

message LinkAddRequest {
    string workspace_id = 1;
    string task_id = 2;
    string other_task_id = 3;
    string kind = 4;
    bool close_duplicate = 5;
}

message LinkCandidate {
    string id = 1;
    string project_id = 2;
    string display_id = 3;
    string title = 4;
    string status_name = 5;
    string status_category = 6;
}

message LinkCandidates {
    repeated LinkCandidate tasks = 1;
}

message LinkList {
    repeated Link links = 1;
}

message LinkListForTaskRequest {
    string workspace_id = 1;
    string task_id = 2;
}

message LinkRemoveRequest {
    string workspace_id = 1;
    string task_id = 2;
    string id = 3;
}

message LinkSearchTasksRequest {
    string workspace_id = 1;
    string query = 2;
}

message Task {
    string id = 1;
    string workspace_id = 2;
    string project_id = 3;
    int32 number = 4;
    string display_id = 5;
    string title = 6;
    string description = 7;
    string status = 8;
    string priority = 9;
    string start_date = 10;
    string due_date = 11;
    repeated string assignee_ids = 12;
    string created_by = 13;
    int32 version = 14;
    string position = 15;
    string created_at = 16;
    string updated_at = 17;
    string deleted_at = 18;
    string status_name = 19;
    string status_category = 20;
    string parent_id = 21;
    int32 depth = 22;
    int32 progress_done = 23;
    int32 progress_total = 24;
    bool is_blocked = 25;
    repeated string blocked_by = 26;
    repeated TaskFieldValueResponse fields = 27;
}

message TaskChildren {
    repeated Task tasks = 1;
}

message TaskCreateRequest {
    string workspace_id = 1;
    string project_id = 2;
    string title = 3;
    string description = 4;
    string status = 5;
    string priority = 6;
    string start_date = 7;
    string due_date = 8;
    repeated string assignee_ids = 9;
    string parent_id = 10;
    repeated TaskFieldValue field_values = 11;
}

message TaskDeleteRequest {
    string workspace_id = 1;
    string project_id = 2;
    string id = 3;
    string mode = 4;
}

message TaskFieldValue {
    string field_id = 1;
    string value = 2;
}

message TaskFieldValueResponse {
    string field_id = 1;
    string value = 2;
}

message TaskGetRequest {
    string workspace_id = 1;
    string project_id = 2;
    string id = 3;
}

message TaskListChildrenRequest {
    string workspace_id = 1;
    string project_id = 2;
    string id = 3;
}

message TaskListRequest {
    string workspace_id = 1;
    string project_id = 2;
    string status = 3;
    string assignee_id = 4;
    string cursor = 5;
    int32 page_size = 6;
    bool include_subtasks = 7;
}

message TaskListTrashRequest {
    string workspace_id = 1;
    string project_id = 2;
}

message TaskMoveRequest {
    string workspace_id = 1;
    string project_id = 2;
    string id = 3;
    int32 expected_version = 4;
    string status = 5;
    bool include_subtasks = 6;
    bool override_blocked = 7;
}

message TaskRestoreRequest {
    string workspace_id = 1;
    string project_id = 2;
    string id = 3;
}

message TaskSetParentRequest {
    string workspace_id = 1;
    string project_id = 2;
    string id = 3;
    int32 expected_version = 4;
    string parent_id = 5;
}

message TaskTrash {
    repeated Task tasks = 1;
}

message TaskUpdateRequest {
    string workspace_id = 1;
    string project_id = 2;
    string id = 3;
    int32 expected_version = 4;
    optional string title = 5;
    optional string description = 6;
    optional string status = 7;
    optional string priority = 8;
    optional string start_date = 9;
    optional string due_date = 10;
    bool set_assignees = 11;
    repeated string assignee_ids = 12;
    bool override_blocked = 13;
    repeated TaskFieldValue field_values = 14;
}

