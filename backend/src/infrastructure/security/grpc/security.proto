syntax = "proto3";

package config.security;

service SecondFactorController {
    rpc Begin(SecondFactorBeginRequest) returns (SecondFactorEnrolment) {}
    rpc Confirm(SecondFactorConfirmRequest) returns (SecondFactorConfirmed) {}
    rpc Disable(SecondFactorDisableRequest) returns (SecondFactorDisabled) {}
    rpc RegenerateCodes(SecondFactorRegenerateRequest) returns (SecondFactorRegenerated) {}
    rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceAnswer) {}
    rpc Status(SecondFactorStatusRequest) returns (SecondFactorStatus) {}
}

service SecurityPolicyController {
    rpc Get(PolicyGetRequest) returns (PolicyAnswer) {}
    rpc Set(PolicySetRequest) returns (PolicyAnswer) {}
}

service SsoController {
    rpc Delete(SsoDeleteRequest) returns (SsoDeleted) {}
    rpc Get(SsoGetRequest) returns (ProviderAnswer) {}
    rpc Save(SsoSaveRequest) returns (ProviderAnswer) {}
    rpc Test(SsoTestRequest) returns (SsoTestAnswer) {}
}

message PolicyAnswer {
    bool require_2fa = 1;
    int32 grace_days = 2;
    string enforced_from = 3;
    bool in_grace = 4;
    bool enrolled = 5;
    bool blocked = 6;
    int32 version = 7;
}

message PolicyGetRequest {
    string workspace_id = 1;
}

message PolicySetRequest {
    string workspace_id = 1;
    bool require_2fa = 2;
    int32 grace_days = 3;
    int32 expected_version = 4;
}

message Provider {
    bool configured = 1;
    string name = 2;
    string issuer = 3;
    string client_id = 4;
    bool has_secret = 5;
    string scopes = 6;
    repeated string allowed_domains = 7;
    string group_claim = 8;
    repeated RoleMapping group_roles = 9;
    string default_role_id = 10;
    bool auto_create_users = 11;
    bool enabled = 12;
    bool enforce_sso = 13;
    int32 version = 14;
    string redirect_uri = 15;
}

message ProviderAnswer {
    Provider provider = 1;
}

message RevokeDeviceAnswer {
    int32 revoked = 1;
}

message RevokeDeviceRequest {
    string device_id = 1;
}

message RoleMapping {
    string group = 1;
    string role_id = 2;
}

message SecondFactorBeginRequest {
}

message SecondFactorConfirmRequest {
    string code = 1;
}

message SecondFactorConfirmed {
    repeated string recovery_codes = 1;
}

message SecondFactorDisableRequest {
    string code = 1;
}

message SecondFactorDisabled {
    bool enabled = 1;
}

message SecondFactorEnrolment {
    string secret = 1;
    string otpauth_uri = 2;
}

message SecondFactorRegenerateRequest {
    string code = 1;
}

message SecondFactorRegenerated {
    repeated string recovery_codes = 1;
}

message SecondFactorStatus {
    bool enabled = 1;
    int32 unused_recovery_codes = 2;
    repeated TrustedDevice trusted_devices = 3;
}

message SecondFactorStatusRequest {
}

message SsoDeleteRequest {
    string workspace_id = 1;
}

message SsoDeleted {
    bool deleted = 1;
}

message SsoGetRequest {
    string workspace_id = 1;
}

message SsoSaveRequest {
    string workspace_id = 1;
    string name = 2;
    string issuer = 3;
    string client_id = 4;
    string client_secret = 5;
    string scopes = 6;
    repeated string allowed_domains = 7;
    string group_claim = 8;
    repeated RoleMapping group_roles = 9;
    string default_role_id = 10;
    bool auto_create_users = 11;
    bool enabled = 12;
    bool enforce_sso = 13;
    int32 expected_version = 14;
}

message SsoTestAnswer {
    bool ok = 1;
    string message = 2;
    string redirect_uri = 3;
    string authorization_endpoint = 4;
    string token_endpoint = 5;
    string jwks_uri = 6;
    int32 keys = 7;
}

message SsoTestRequest {
    string workspace_id = 1;
}

message TrustedDevice {
    string id = 1;
    string label = 2;
    string created_at = 3;
    string last_used_at = 4;
    string expires_at = 5;
}

