syntax = "proto3";

package config.savedviews;

service ViewController {
    rpc Delete(ViewDeleteRequest) returns (SavedView) {}
    rpc List(ViewListRequest) returns (ViewList) {}
    rpc Save(ViewSaveRequest) returns (SavedView) {}
}

message BoardLayout {
    string group_by = 1;
    string swimlane = 2;
    repeated string card_fields = 3;
    repeated BoardLimit limits = 4;
}

message BoardLayoutResponse {
    string group_by = 1;
    string swimlane = 2;
    repeated string card_fields = 3;
    repeated BoardLimitResponse limits = 4;
}

message BoardLimit {
    string column = 1;
    int32 limit = 2;
}

message BoardLimitResponse {
    string column = 1;
    int32 limit = 2;
}

message CalendarLayout {
    string mode = 1;
    string color_by = 2;
    int32 week_start = 3;
    bool hide_done = 4;
}

message CalendarLayoutResponse {
    string mode = 1;
    string color_by = 2;
    int32 week_start = 3;
    bool hide_done = 4;
}

message FilterLayout {
    string ast_json = 1;
    string saved_id = 2;
}

message FilterLayoutResponse {
    string ast_json = 1;
    string saved_id = 2;
}

message Layout {
    repeated string columns = 1;
    repeated LayoutWidth widths = 2;
    repeated LayoutSort sort = 3;
    string group_by = 4;
}

message LayoutResponse {
    repeated string columns = 1;
    repeated LayoutWidthResponse widths = 2;
    repeated LayoutSortResponse sort = 3;
    string group_by = 4;
}

message LayoutSort {
    string key = 1;
    bool desc = 2;
}

message LayoutSortResponse {
    string key = 1;
    bool desc = 2;
}

message LayoutWidth {
    string column = 1;
    int32 width = 2;
}

message LayoutWidthResponse {
    string column = 1;
    int32 width = 2;
}

message SavedView {
    string id = 1;
    string project_id = 2;
    string owner_id = 3;
    string name = 4;
    string kind = 5;
    bool is_shared = 6;
    LayoutResponse layout = 7;
    int32 version = 8;
    string updated_at = 9;
    BoardLayoutResponse board = 10;
    CalendarLayoutResponse calendar = 11;
    FilterLayoutResponse active_filter = 12;
    TimelineLayoutResponse timeline = 13;
    bool pinned_as_tab = 14;
    int32 tab_order = 15;
}

message TimelineLayout {
    string zoom = 1;
    string group_by = 2;
    bool hide_done = 3;
    bool critical_path = 4;
}

message TimelineLayoutResponse {
    string zoom = 1;
    string group_by = 2;
    bool hide_done = 3;
    bool critical_path = 4;
}

message ViewDeleteRequest {
    string workspace_id = 1;
    string project_id = 2;
    string id = 3;
}

message ViewList {
    repeated SavedView views = 1;
}

message ViewListRequest {
    string workspace_id = 1;
    string project_id = 2;
    string kind = 3;
}

message ViewSaveRequest {
    string workspace_id = 1;
    string project_id = 2;
    string id = 3;
    int32 expected_version = 4;
    string name = 5;
    string kind = 6;
    Layout layout = 7;
    bool shared = 8;
    BoardLayout board = 9;
    CalendarLayout calendar = 10;
    FilterLayout active_filter = 11;
    TimelineLayout timeline = 12;
    bool pinned_as_tab = 13;
    int32 tab_order = 14;
}

