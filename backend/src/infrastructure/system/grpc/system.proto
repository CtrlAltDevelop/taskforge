syntax = "proto3";

package config.system;

import "google/protobuf/empty.proto";

service SystemController {
    rpc Info(google.protobuf.Empty) returns (SystemInfo) {}
    rpc SetCollectDeviceInfo(SetCollectDeviceInfoRequest) returns (SystemInfo) {}
}

message SetCollectDeviceInfoRequest {
    bool enabled = 1;
}

message SystemInfo {
    string version = 1;
    string min_client_version = 2;
    string api = 3;
    string commit = 4;
    string redis = 5;
    string broker = 6;
    bool eager = 7;
    int32 workers = 8;
    map<string,int32> backlog = 9;
    bool collect_device_info = 10;
    bool device_pepper_set = 11;
}

