name: Release

# Push a tag `vX.Y.Z` (X.Y.Z must equal the VERSION file) to build every artifact and publish a
# GitHub release: Docker images (GHCR), web bundle, Android APK/AAB, Windows/Linux/macOS
# installers and, only when the signing secrets exist, the iOS IPA.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$TAG" ] || { echo "Tag $GITHUB_REF_NAME does not match VERSION $VERSION"; exit 1; }
          grep -q "^version: $VERSION" app/pubspec.yaml || { echo "pubspec.yaml version differs: run deploy/scripts/set-version.sh"; exit 1; }
          grep -q "^version = \"$VERSION\"" backend/pyproject.toml || { echo "pyproject.toml version differs: run deploy/scripts/set-version.sh"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

  images:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names (lower case)
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          build-args: COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER }}/taskforge-backend:${{ needs.verify.outputs.version }}
            ghcr.io/${{ env.OWNER }}/taskforge-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          push: true
          build-args: VERSION=${{ needs.verify.outputs.version }}
          tags: |
            ghcr.io/${{ env.OWNER }}/taskforge-web:${{ needs.verify.outputs.version }}
            ghcr.io/${{ env.OWNER }}/taskforge-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  web:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with: { channel: "${{ env.FLUTTER_CHANNEL }}", cache: true }
      - run: |
          cd app && flutter pub get
          flutter build web --release --dart-define=SAME_ORIGIN=true --dart-define=APP_VERSION=${{ needs.verify.outputs.version }}
          cd build/web && zip -r "$GITHUB_WORKSPACE/taskforge-web-${{ needs.verify.outputs.version }}.zip" .
      - uses: actions/upload-artifact@v4
        with: { name: web, path: "taskforge-web-*.zip" }

  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: "${{ env.FLUTTER_CHANNEL }}", cache: true }
      - name: Signing key (only when the secrets exist; otherwise the build is debug-signed)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > app/android/release.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$GITHUB_WORKSPACE/app/android/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > app/android/key.properties
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK/AAB are not release-signed"
          fi
      - run: |
          cd app && flutter pub get
          flutter build apk --release --dart-define=APP_VERSION=${{ needs.verify.outputs.version }}
          flutter build appbundle --release --dart-define=APP_VERSION=${{ needs.verify.outputs.version }}
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/taskforge-${{ needs.verify.outputs.version }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/taskforge-${{ needs.verify.outputs.version }}.aab"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "taskforge-*.*" }

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with: { channel: "${{ env.FLUTTER_CHANNEL }}", cache: true }
      - shell: pwsh
        run: |
          $v = "${{ needs.verify.outputs.version }}"
          cd app; flutter pub get
          flutter build windows --release --dart-define=APP_VERSION=$v
          $src = (Resolve-Path build/windows/x64/runner/Release).Path
          Compress-Archive -Path "$src\*" -DestinationPath "$env:GITHUB_WORKSPACE\taskforge-$v-windows-x64.zip"
          # Installer: Inno Setup (preinstalled on the runner image, else installed here).
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iss = @"
          [Setup]
          AppName=TaskForge
          AppVersion=$($v -replace '-.*','')
          DefaultDirName={autopf}\TaskForge
          DefaultGroupName=TaskForge
          OutputDir=$env:GITHUB_WORKSPACE
          OutputBaseFilename=taskforge-$v-windows-x64-setup
          Compression=lzma2
          [Files]
          Source: "$src\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{group}\TaskForge"; Filename: "{app}\taskforge.exe"
          "@
          Set-Content -Path installer.iss -Value $iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "taskforge-*windows*" }

  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with: { channel: "${{ env.FLUTTER_CHANNEL }}", cache: true }
      - run: |
          V="${{ needs.verify.outputs.version }}"
          cd app && flutter pub get
          flutter build linux --release --dart-define=APP_VERSION=$V
          BUNDLE="$PWD/build/linux/x64/release/bundle"
          tar -czf "$GITHUB_WORKSPACE/taskforge-$V-linux-x64.tar.gz" -C "$BUNDLE" .
          # .deb: the bundle under /opt/taskforge plus a launcher on the PATH.
          PKG="$(mktemp -d)"
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/taskforge" "$PKG/usr/bin"
          cp -r "$BUNDLE"/. "$PKG/opt/taskforge/"
          ln -s /opt/taskforge/taskforge "$PKG/usr/bin/taskforge"
          printf 'Package: taskforge\nVersion: %s\nArchitecture: amd64\nMaintainer: TaskForge\nDescription: TaskForge desktop client\nDepends: libgtk-3-0, libsecret-1-0\n' "${V//-/~}" > "$PKG/DEBIAN/control"
          dpkg-deb --build "$PKG" "$GITHUB_WORKSPACE/taskforge-$V-linux-amd64.deb"
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "taskforge-*linux*" }

  macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with: { channel: "${{ env.FLUTTER_CHANNEL }}", cache: true }
      - run: |
          V="${{ needs.verify.outputs.version }}"
          cd app && flutter pub get
          flutter build macos --release --dart-define=APP_VERSION=$V
          APP="$(ls -d build/macos/Build/Products/Release/*.app | head -n1)"
          STAGE="$(mktemp -d)"; cp -R "$APP" "$STAGE/"; ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname TaskForge -srcfolder "$STAGE" -ov -format UDZO "$GITHUB_WORKSPACE/taskforge-$V-macos.dmg"
          echo "::warning::The app is not notarized: users must allow it in System Settings"
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "taskforge-*.dmg" }

  # iOS needs an Apple developer account. The job runs only when all signing secrets exist.
  ios-gate:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.g.outputs.enabled }}
    steps:
      - id: g
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          PASS: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PROFILE" ] && [ -n "$PASS" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "::notice::iOS signing secrets not set: skipping the iOS build"; fi

  ios:
    needs: [verify, ios-gate]
    if: needs.ios-gate.outputs.enabled == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with: { channel: "${{ env.FLUTTER_CHANNEL }}", cache: true }
      - name: Import the signing certificate and provisioning profile
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          PASS: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"; KP="$(uuidgen)"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          echo "$CERT" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/taskforge.mobileprovision"
      - env:
          EXPORT_OPTIONS: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          V="${{ needs.verify.outputs.version }}"
          echo "$EXPORT_OPTIONS" | base64 -d > "$RUNNER_TEMP/ExportOptions.plist"
          cd app && flutter pub get
          flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" --dart-define=APP_VERSION=$V
          cp build/ios/ipa/*.ipa "$GITHUB_WORKSPACE/taskforge-$V.ipa"
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: "taskforge-*.ipa" }

  release:
    needs: [verify, images, web, android, windows, linux, macos, ios]
    # iOS may be skipped; everything else must have succeeded.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Changelog (commits since the previous tag, grouped by type)
        run: |
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          RANGE="${PREV:+$PREV..}${GITHUB_REF_NAME}"
          {
            echo "## ${GITHUB_REF_NAME}"; echo
            for TYPE in add fix upgrade perf refactor remove security; do
              LINES="$(git log --no-merges --pretty='- %s (%h)' "$RANGE" | grep -E "^- [^ ]+ ${TYPE}(\\(|:)" || true)"
              [ -n "$LINES" ] && { echo "### ${TYPE}"; echo "$LINES"; echo; }
            done
            echo "### Docker"; echo
            echo "    TASKFORGE_VERSION=${{ needs.verify.outputs.version }}"
            echo "Upgrade: see deploy/README.md. Older clients are refused only if DJANGO_MIN_CLIENT_VERSION is raised."
          } > CHANGELOG.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: dist/*
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
